<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ff82"/>
      <stop offset="35%" stop-color="#e6fd53"/>
      <stop offset="70%" stop-color="#b6d800"/>
      <stop offset="100%" stop-color="#8ba600"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="darkTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2535"/>
      <stop offset="50%" stop-color="#0e1622"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <radialGradient id="deepNavyBg" cx="40%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="40%" stop-color="#0f2238"/>
      <stop offset="75%" stop-color="#091422"/>
      <stop offset="100%" stop-color="#03070d"/>
    </radialGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e6fd53" flood-opacity="0.35"/>
    </filter>

    <path id="textArcTop" d="M 64 256 A 192 192 0 0 1 448 256" fill="none" />
    <path id="textArcBottom" d="M 448 256 A 192 192 0 0 1 64 256" fill="none" />
  </defs>

  <!-- 1. Outer Rings & Circular Frame -->
  <circle cx="256" cy="256" r="248" fill="url(#darkTitanium)" stroke="url(#voltGrad)" stroke-width="4.5" filter="url(#badgeGlow)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#cyanAccent)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#voltGrad)" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- 2. Typography Along Circular Ring Band -->
  <text fill="url(#voltGrad)" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="20" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">DREAD ELEVEN CRICKET CLUB</textPath>
  </text>

  <text fill="#ffffff" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="18.5" letter-spacing="3.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">REWA &#183; 3x CHAMPIONS</textPath>
  </text>

  <!-- Flanking Accent Stars on the Ring -->
  <g fill="url(#voltGrad)">
    <polygon points="50,256 53,260 59,260 54,264 56,270 50,266 44,270 46,264 41,260 47,260"/>
    <polygon points="462,256 465,260 471,260 466,264 468,270 462,266 456,270 458,264 453,260 459,260"/>
  </g>

  <!-- 3. Inner Circular Arena -->
  <circle cx="256" cy="256" r="162" fill="url(#deepNavyBg)" stroke="url(#voltGrad)" stroke-width="3"/>

  <!-- Subtle Radial Speed Rays Behind Monogram -->
  <g stroke="rgba(230, 253, 83, 0.08)" stroke-width="1.5">
    <line x1="256" y1="94" x2="256" y2="418"/>
    <line x1="94" y1="256" x2="418" y2="256"/>
    <line x1="141" y1="141" x2="371" y2="371"/>
    <line x1="371" y1="141" x2="141" y2="371"/>
  </g>

  <!-- Three Championship Stars Top (2021, 2022, 2023) -->
  <g fill="url(#voltGrad)">
    <!-- Left Star (2021) -->
    <polygon points="214,142 216.5,147.5 222,147.5 217.5,151 219.5,156.5 214,153 208.5,156.5 210.5,151 206,147.5 211.5,147.5"/>
    <!-- Center Star (2022 - Grand) -->
    <polygon points="256,132 259.5,139.5 267.5,139.5 261,144.5 263.5,152 256,147 248.5,152 251,144.5 244.5,139.5 252.5,139.5"/>
    <!-- Right Star (2023) -->
    <polygon points="298,142 300.5,147.5 306,147.5 301.5,151 303.5,156.5 298,153 292.5,156.5 294.5,151 290,147.5 295.5,147.5"/>
  </g>

  <!-- Crossed Cricket Bats (Background behind Monogram) -->
  <g stroke="url(#voltGrad)" stroke-width="5" stroke-linecap="round" opacity="0.4">
    <line x1="176" y1="336" x2="336" y2="176"/>
    <line x1="336" y1="336" x2="176" y2="176"/>
  </g>
  <!-- Cricket Seam Ball in Center Background -->
  <circle cx="256" cy="256" r="68" fill="#080c14" stroke="url(#voltGrad)" stroke-width="2.5" opacity="0.8"/>
  <path d="M 230 200 C 270 230, 240 280, 282 312" fill="none" stroke="url(#cyanAccent)" stroke-width="2" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- 4. Dominant "DE" Monogram -->
  <g id="deMonogram">
    <!-- Letter D -->
    <path d="M 160 195 H 224 C 252 195 268 212 268 244 C 268 276 252 293 224 293 H 160 Z M 186 216 V 272 H 220 C 235 272 243 262 243 244 C 243 226 235 216 220 216 Z" fill="#ffffff" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))"/>
    <path d="M 186 216 V 272 H 220 C 235 272 243 262 243 244 C 243 226 235 216 220 216 Z" fill="url(#voltGrad)" opacity="0.25"/>

    <!-- Letter E (Overlapping Dynamic) -->
    <path d="M 276 195 H 348 V 217 H 302 V 233 H 340 V 254 H 302 V 271 H 348 V 293 H 276 Z" fill="url(#voltGrad)" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.8))"/>
  </g>

  <!-- Established Ribbon Accent -->
  <rect x="206" y="324" width="100" height="24" rx="4" fill="url(#darkTitanium)" stroke="url(#voltGrad)" stroke-width="1.5"/>
  <text x="256" y="340" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">EST. 2021</text>

  <!-- Bottom Crown Arc Accent -->
  <path d="M 220 366 Q 256 376 292 366" fill="none" stroke="url(#voltGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>